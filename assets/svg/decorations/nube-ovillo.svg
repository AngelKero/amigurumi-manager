<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudYarnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F9"/>
      <stop offset="100%" stop-color="#EFE2E8"/>
    </linearGradient>
    <linearGradient id="yarnBallCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5728B"/>
      <stop offset="100%" stop-color="#8E5B74"/>
    </linearGradient>
  </defs>

  <!-- Cloud Base -->
  <g>
    <path d="M 70 145 C 40 145 25 122 32 95 C 28 65 60 45 88 55 C 105 28 152 18 185 40 C 205 24 252 30 268 58 C 295 58 310 85 300 115 C 310 142 282 155 255 150 Z" fill="url(#cloudYarnGrad)" stroke="#E4D5DC" stroke-width="1.5"/>
    <path d="M 74 136 C 50 136 38 118 43 96 C 40 72 65 56 88 64 C 102 42 142 34 168 52 C 185 38 226 44 238 66 C 262 66 274 88 266 112 C 274 134 252 145 230 140 Z" fill="none" stroke="#8E5B74" stroke-width="1.8" stroke-dasharray="5 4" opacity="0.45"/>

    <!-- Little Yarn Ball Resting on Cloud -->
    <g transform="translate(195, 80)">
      <circle cx="40" cy="40" r="32" fill="url(#yarnBallCloud)"/>
      <path d="M 18 32 C 28 18 52 18 62 32 C 52 46 28 46 18 32 Z" fill="none" stroke="#FAF4F7" stroke-width="2" stroke-dasharray="4 3" opacity="0.75"/>
      <path d="M 22 48 C 32 62 50 62 58 48 C 48 34 32 34 22 48 Z" fill="none" stroke="#FAF4F7" stroke-width="2" stroke-dasharray="4 3" opacity="0.75"/>
      <path d="M 40 10 C 40 30 40 50 40 70" fill="none" stroke="#FAF4F7" stroke-width="2.5" stroke-dasharray="5 3" opacity="0.8"/>
      <circle cx="40" cy="40" r="29" fill="none" stroke="#75475E" stroke-width="1.5" opacity="0.6"/>
      <!-- Trailing thread dripping from cloud -->
      <path d="M 40 72 C 35 90 20 100 25 115 C 30 128 48 128 42 140" fill="none" stroke="#8E5B74" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Floating Sparkles -->
    <path d="M 90 30 L 93 38 L 101 41 L 93 44 L 90 52 L 87 44 L 79 41 L 87 38 Z" fill="#D99C52" opacity="0.85"/>
    <path d="M 50 85 L 52 90 L 57 92 L 52 94 L 50 99 L 48 94 L 43 92 L 48 90 Z" fill="#52857C" opacity="0.8"/>
  </g>
</svg>
