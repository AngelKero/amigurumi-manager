    <rect x="25" y="112" width="110" height="24" rx="12" fill="#8E5B74"/>
    <text x="80" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#FAF4F7" letter-spacing="0.5">
