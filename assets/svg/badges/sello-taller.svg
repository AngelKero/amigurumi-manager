    <path d="M 80 54 C 88 54 94 58 94 66 C 94 78 80 86 80 86 C 80 86 66 78 66 66 C 66 58 72 54 80 54 Z" fill="#FAF4F7"/>

    <!-- Mini Stars -->
    <polygon points="42,76 45,82 52,83 47,88 48,95 42,91 36,95 37,88 32,83 39,82" fill="#D99C52"/>
    <polygon points="118,76 121,82 128,83 123,88 124,95 118,91 112,95 113,88 108,83 115,82" fill="#D99C52"/>

