    <circle cx="80" cy="80" r="76" fill="#FFFDF8" stroke="#D99C52" stroke-width="2.5"/>
    <circle cx="80" cy="80" r="70" fill="none" stroke="#D99C52" stroke-width="1.8" stroke-dasharray="5 4"/>

