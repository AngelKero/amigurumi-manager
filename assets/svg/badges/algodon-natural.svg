<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- 100% Organic Natural Cotton Seal -->
  <g>
    <!-- Background Circle -->
    <circle cx="80" cy="80" r="76" fill="#F4F8F7" stroke="#52857C" stroke-width="2.5"/>
    <circle cx="80" cy="80" r="70" fill="none" stroke="#52857C" stroke-width="1.8" stroke-dasharray="5 4"/>

    <!-- Cotton Boll Flower Icon -->
    <!-- Calyx Leaves -->
    <path d="M 80 100 C 65 110 55 125 70 128 C 80 125 80 110 80 100 Z" fill="#406B63"/>
    <path d="M 80 100 C 95 110 105 125 90 128 C 80 125 80 110 80 100 Z" fill="#406B63"/>
    <!-- Stem -->
    <path d="M 80 110 L 80 135" stroke="#406B63" stroke-width="4" stroke-linecap="round"/>

    <!-- Puffy Cotton Bolls -->
    <circle cx="62" cy="78" r="20" fill="#FFFFFF" stroke="#E2ECE9" stroke-width="1.5"/>
    <circle cx="98" cy="78" r="20" fill="#FFFFFF" stroke="#E2ECE9" stroke-width="1.5"/>
    <circle cx="80" cy="62" r="22" fill="#FFFFFF" stroke="#E2ECE9" stroke-width="1.5"/>
    <circle cx="80" cy="82" r="18" fill="#FFFFFF"/>

    <!-- Cotton Tufts Stitched Details -->
    <path d="M 75 60 Q 80 52 85 60" stroke="#7DB3A9" stroke-width="1.8" fill="none"/>
    <path d="M 58 76 Q 52 82 58 88" stroke="#7DB3A9" stroke-width="1.8" fill="none"/>
    <path d="M 102 76 Q 108 82 102 88" stroke="#7DB3A9" stroke-width="1.8" fill="none"/>

    <!-- Badge Text Ribbon -->
    <rect x="22" y="112" width="116" height="24" rx="12" fill="#52857C"/>
    <text x="80" y="128" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" letter-spacing="0.5">
      100% ALGODÓN PURO
    </text>
  </g>
</svg>
