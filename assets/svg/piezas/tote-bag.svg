<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="100%" height="100%">
  <defs>
    <filter id="softShadowBag" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E252D" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="trapilloGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52857C"/>
      <stop offset="50%" stop-color="#46736B"/>
      <stop offset="100%" stop-color="#3A6059"/>
    </linearGradient>
    <linearGradient id="handleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D99C52"/>
      <stop offset="100%" stop-color="#C5853B"/>
    </linearGradient>
    <pattern id="basketWeave" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 L20 10 M10 0 L10 20" stroke="rgba(235, 244, 242, 0.22)" stroke-width="1.5"/>
      <circle cx="10" cy="10" r="1.5" fill="#EBF4F2" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="200" cy="190" r="135" fill="#EBF4F2" opacity="0.75"/>
  <circle cx="200" cy="190" r="95" fill="#F7EFF3" opacity="0.5"/>

  <!-- Tote Bag Group -->
  <g filter="url(#softShadowBag)">
    <!-- Back Handle -->
    <path d="M 160 140 C 160 60, 240 60, 240 140" 
          fill="none" stroke="#C5853B" stroke-width="9" stroke-linecap="round"/>
    <path d="M 160 140 C 160 60, 240 60, 240 140" 
          fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="3,3" stroke-linecap="round"/>

    <!-- Bag Body Trapezoid / Oval Base -->
    <path d="M 125 130 
             L 275 130 
             L 288 275 
             C 288 295, 255 305, 200 305 
             C 145 305, 112 295, 112 275 
             Z" 
          fill="url(#trapilloGradient)" stroke="#235048" stroke-width="2.5"/>

    <!-- Texture Layer -->
    <path d="M 125 130 L 275 130 L 288 275 C 288 295, 255 305, 200 305 C 145 305, 112 295, 112 275 Z" 
          fill="url(#basketWeave)"/>

    <!-- Top Hem Border with Plum Velvet Trim -->
    <path d="M 120 130 C 120 126, 280 126, 280 130 L 277 142 L 123 142 Z" fill="#8E5B74"/>
    <line x1="125" y1="136" x2="275" y2="136" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Decorative Boho Crochet Chevron Bands -->
    <g opacity="0.9">
      <!-- Chevron Band 1 (Nordic Honey) -->
      <path d="M 120 185 L 140 195 L 160 185 L 180 195 L 200 185 L 220 195 L 240 185 L 260 195 L 280 185" 
            fill="none" stroke="#D99C52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Chevron Band 2 (Glacier Cream) -->
      <path d="M 118 200 L 140 210 L 160 200 L 180 210 L 200 200 L 220 210 L 240 200 L 260 210 L 282 200" 
            fill="none" stroke="#EBF4F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Chevron Band 3 (Plum Rose) -->
      <path d="M 116 215 L 140 225 L 160 215 L 180 225 L 200 215 L 220 225 L 240 215 L 260 225 L 284 215" 
            fill="none" stroke="#8E5B74" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Hanging Boho Tassel / Charm on Left -->
    <g transform="translate(138, 142)">
      <!-- Ring & Loop -->
      <circle cx="0" cy="0" r="4.5" fill="#D99C52"/>
      <line x1="0" y1="4" x2="0" y2="18" stroke="#8E5B74" stroke-width="2.5"/>
      <!-- Tassel Head -->
      <circle cx="0" cy="22" r="6" fill="#8E5B74"/>
      <!-- Tassel Fringe Threads -->
      <path d="M -5 27 L -7 52 M -2 28 L -3 55 M 0 28 L 0 57 M 2 28 L 3 55 M 5 27 L 7 52" 
            stroke="#D99C52" stroke-width="2" stroke-linecap="round"/>
      <path d="M -4 28 L -5 50 M 0 28 L 1 52 M 4 28 L 5 50" 
            stroke="#52857C" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Front Handle with Leather Grain & Stitching -->
    <path d="M 152 142 C 152 65, 248 65, 248 142" 
          fill="none" stroke="url(#handleGradient)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 152 142 C 152 65, 248 65, 248 142" 
          fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="3,3" stroke-linecap="round"/>

    <!-- Handle Reinforcement Leather Patches -->
    <!-- Left Patch -->
    <g transform="translate(152, 142)">
      <rect x="-8" y="-4" width="16" height="22" rx="4" fill="#C5853B" stroke="#235048" stroke-width="1"/>
      <circle cx="-3" cy="2" r="1.5" fill="#235048"/>
      <circle cx="3" cy="2" r="1.5" fill="#235048"/>
      <circle cx="-3" cy="12" r="1.5" fill="#235048"/>
      <circle cx="3" cy="12" r="1.5" fill="#235048"/>
    </g>
    <!-- Right Patch -->
    <g transform="translate(248, 142)">
      <rect x="-8" y="-4" width="16" height="22" rx="4" fill="#C5853B" stroke="#235048" stroke-width="1"/>
      <circle cx="-3" cy="2" r="1.5" fill="#235048"/>
      <circle cx="3" cy="2" r="1.5" fill="#235048"/>
      <circle cx="-3" cy="12" r="1.5" fill="#235048"/>
      <circle cx="3" cy="12" r="1.5" fill="#235048"/>
    </g>

    <!-- Bottom Leather Protective Trim -->
    <path d="M 125 285 C 160 300, 240 300, 275 285 L 273 294 C 238 307, 162 307, 127 294 Z" fill="#C5853B" opacity="0.9"/>
  </g>
</svg>
