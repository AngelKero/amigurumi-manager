<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="500" height="500" rx="28" fill="#F4F2FA"/>
  <rect x="12" y="12" width="476" height="476" rx="20" fill="none" stroke="#7E6BA8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>

  <!-- Base Shadow -->
  <ellipse cx="250" cy="445" rx="110" ry="16" fill="#DCD8E8" opacity="0.6"/>

  <!-- Spiraling Crochet Tentacles (Underneath) -->
  <g fill="none" stroke-linecap="round">
    <!-- Center Spiral Ribbon Tentacles -->
    <path d="M 230 270 Q 210 320 235 360 T 220 420" stroke="#9A89C4" stroke-width="8"/>
    <path d="M 230 270 Q 210 320 235 360 T 220 420" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="4 4"/>

    <path d="M 250 275 Q 275 325 245 375 T 255 435" stroke="#7E6BA8" stroke-width="10"/>
    <path d="M 250 275 Q 275 325 245 375 T 255 435" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4"/>

    <path d="M 270 270 Q 290 315 265 365 T 280 420" stroke="#B8A9DD" stroke-width="8"/>
    <path d="M 270 270 Q 290 315 265 365 T 280 420" stroke="#FFFFFF" stroke-width="1.8" stroke-dasharray="4 4"/>

    <!-- Outer Thin Wavy Tentacles -->
    <path d="M 180 260 Q 150 310 175 360 T 160 410" stroke="#C4B8E5" stroke-width="5"/>
    <path d="M 320 260 Q 350 310 325 360 T 340 410" stroke="#C4B8E5" stroke-width="5"/>
  </g>

  <!-- Jellyfish Plush Bell Dome (Head) -->
  <path d="M 140 240 C 140 120 360 120 360 240 C 360 270 140 270 140 240 Z" fill="#9A89C4"/>

  <!-- Ruffled Scalloped Skirt at Bottom of Bell -->
  <path d="M 140 245 Q 160 270 180 248 Q 200 270 220 248 Q 240 270 260 248 Q 280 270 300 248 Q 320 270 340 248 Q 360 270 360 245 L 360 240 L 140 240 Z" fill="#7E6BA8"/>
  <path d="M 140 245 Q 160 270 180 248 Q 200 270 220 248 Q 240 270 260 248 Q 280 270 300 248 Q 320 270 340 248 Q 360 270 360 245" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3" fill="none"/>

  <!-- Soft Head Highlights & French Knot Freckles -->
  <circle cx="210" cy="165" r="4.5" fill="#EAE5F7"/>
  <circle cx="250" cy="150" r="5" fill="#EAE5F7"/>
  <circle cx="290" cy="165" r="4.5" fill="#EAE5F7"/>
  <circle cx="230" cy="180" r="3.5" fill="#EAE5F7"/>
  <circle cx="270" cy="180" r="3.5" fill="#EAE5F7"/>

  <!-- Safety Eyes with Star Catchlight -->
  <g>
    <circle cx="215" cy="215" r="11" fill="#1E252D"/>
    <circle cx="218" cy="212" r="3.5" fill="#FFFFFF"/>
    <circle cx="285" cy="215" r="11" fill="#1E252D"/>
    <circle cx="288" cy="212" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Blush Cheeks -->
  <circle cx="185" cy="228" r="12" fill="#EFAAC4" opacity="0.6"/>
  <circle cx="315" cy="228" r="12" fill="#EFAAC4" opacity="0.6"/>

  <!-- Kawaii Smile -->
  <path d="M 242 225 Q 250 234 258 225" stroke="#1E252D" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Tiny Sparkle Elements -->
  <path d="M 175 140 L 175 152 M 169 146 L 181 146" stroke="#D99C52" stroke-width="2" stroke-linecap="round"/>
  <path d="M 325 140 L 325 152 M 319 146 L 331 146" stroke="#D99C52" stroke-width="2" stroke-linecap="round"/>

  <!-- Bottom Crafted Ribbon Tag -->
  <g transform="translate(130, 450)">
    <rect width="240" height="34" rx="17" fill="#FFFFFF" stroke="#7E6BA8" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="120" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#5F4B8B">
      ✨ Medusa Mágica &bull; Hilo Glaseado
    </text>
  </g>
</svg>
