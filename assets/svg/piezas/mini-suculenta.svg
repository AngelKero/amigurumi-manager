<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="500" height="500" rx="28" fill="#F3F7F5"/>
  <rect x="12" y="12" width="476" height="476" rx="20" fill="none" stroke="#52857C" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>

  <!-- Base Shadow -->
  <ellipse cx="250" cy="425" rx="110" ry="20" fill="#D6DFDB" opacity="0.7"/>

  <!-- Terracotta Crochet Pot -->
  <g>
    <!-- Pot Body -->
    <path d="M 180 270 L 195 395 Q 200 410 250 410 Q 300 410 305 395 L 320 270 Z" fill="#C47A57"/>
    <!-- Pot Rim with Running Stitches -->
    <rect x="165" y="250" width="170" height="28" rx="8" fill="#D48B68" stroke="#A85E3B" stroke-width="1.5"/>
    <line x1="172" y1="264" x2="328" y2="264" stroke="#FDF5EB" stroke-width="2" stroke-dasharray="5 4"/>

    <!-- Kawaii Face on Pot -->
    <circle cx="225" cy="335" r="7" fill="#2D2621"/>
    <circle cx="227" cy="333" r="2.5" fill="#FFFFFF"/>
    
    <circle cx="275" cy="335" r="7" fill="#2D2621"/>
    <circle cx="277" cy="333" r="2.5" fill="#FFFFFF"/>

    <!-- Blush on Pot -->
    <ellipse cx="210" cy="344" rx="8" ry="5" fill="#E88874" opacity="0.6"/>
    <ellipse cx="290" cy="344" rx="8" ry="5" fill="#E88874" opacity="0.6"/>

    <!-- Gentle Stitched Smile -->
    <path d="M 243 346 Q 250 353 257 346" stroke="#2D2621" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Soil Mound -->
  <ellipse cx="250" cy="255" rx="72" ry="18" fill="#543D32"/>
  <ellipse cx="250" cy="254" rx="66" ry="14" fill="none" stroke="#6E5042" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Succulent Leaves (Nordic Spruce & Mint Clusters) -->
  <g>
    <!-- Outer Lower Leaves -->
    <path d="M 210 245 C 160 230 150 180 185 170 C 215 160 230 210 210 245 Z" fill="#52857C"/>
    <path d="M 290 245 C 340 230 350 180 315 170 C 285 160 270 210 290 245 Z" fill="#52857C"/>

    <!-- Mid Layer Leaves -->
    <path d="M 220 220 C 180 190 190 130 225 135 C 250 140 245 195 220 220 Z" fill="#659B91"/>
    <path d="M 280 220 C 320 190 310 130 275 135 C 250 140 255 195 280 220 Z" fill="#659B91"/>

    <!-- Center Heart Rosette Leaf -->
    <path d="M 250 210 C 220 160 230 95 250 100 C 270 95 280 160 250 210 Z" fill="#7DB3A9"/>

    <!-- Running Stitch Highlights along Leaf Spines -->
    <path d="M 185 175 Q 200 205 208 230" stroke="#EBF4F2" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <path d="M 315 175 Q 300 205 292 230" stroke="#EBF4F2" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
    <path d="M 250 115 L 250 195" stroke="#EBF4F2" stroke-width="2" stroke-dasharray="4 3" fill="none"/>

    <!-- Tiny Crochet Flower Bud Accent -->
    <circle cx="280" cy="120" r="14" fill="#E89EB1"/>
    <circle cx="280" cy="120" r="6" fill="#D99C52"/>
    <path d="M 280 102 L 280 138 M 262 120 L 298 120" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom Crafted Ribbon Tag -->
  <g transform="translate(130, 440)">
    <rect width="240" height="34" rx="17" fill="#FFFFFF" stroke="#52857C" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="120" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#235048">
      🌿 Mini Suculenta &bull; Colección Botánica
    </text>
  </g>
</svg>
