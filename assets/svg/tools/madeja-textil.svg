<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <!-- Skein of Yarn (Madeja de Algodón) -->
  <g>
    <!-- Base Shadow -->
    <ellipse cx="120" cy="155" rx="85" ry="16" fill="#E2D4DC" opacity="0.6"/>

    <!-- Left & Right Yarn Bulb Lobes -->
    <!-- Left Bulb -->
    <ellipse cx="65" cy="90" rx="45" ry="55" fill="#8E5B74"/>
    <path d="M 35 70 C 45 45 80 45 90 70" stroke="#A66E8A" stroke-width="3" fill="none"/>
    <path d="M 30 90 C 45 65 85 65 95 90" stroke="#75475E" stroke-width="3" fill="none"/>
    <path d="M 35 110 C 45 135 80 135 90 110" stroke="#A66E8A" stroke-width="3" fill="none"/>
    <path d="M 50 50 Q 75 90 50 130" stroke="#FAF4F7" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>

    <!-- Right Bulb -->
    <ellipse cx="175" cy="90" rx="45" ry="55" fill="#8E5B74"/>
    <path d="M 150 70 C 160 45 195 45 205 70" stroke="#A66E8A" stroke-width="3" fill="none"/>
    <path d="M 145 90 C 160 65 200 65 210 90" stroke="#75475E" stroke-width="3" fill="none"/>
    <path d="M 150 110 C 160 135 195 135 205 110" stroke="#A66E8A" stroke-width="3" fill="none"/>
    <path d="M 190 50 Q 165 90 190 130" stroke="#FAF4F7" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>

    <!-- Central Skein Waist (Cintura de la Madeja) -->
    <rect x="80" y="55" width="80" height="70" fill="#75475E"/>
    <ellipse cx="120" cy="55" rx="30" ry="10" fill="#60374B"/>
    <ellipse cx="120" cy="125" rx="30" ry="10" fill="#60374B"/>

    <!-- Workshop Paper Band Label (Faja de Papel Artesanal) -->
    <rect x="82" y="65" width="76" height="50" fill="#FFFDF9" stroke="#E4E8ED" stroke-width="1.2"/>
    <line x1="84" y1="68" x2="156" y2="68" stroke="#8E5B74" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="84" y1="112" x2="156" y2="112" stroke="#8E5B74" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Label Text & Logo -->
    <text x="120" y="82" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="9" fill="#8E5B74">Algodón</text>
    <text x="120" y="93" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-weight="700" font-size="8" fill="#52857C">Nórdico</text>
    <text x="120" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="6" fill="#87929E">100g &bull; 100% PURO</text>
  </g>
</svg>
