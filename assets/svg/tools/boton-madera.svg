<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Natural Wooden Button with Grain and Stitched Thread -->
  <g>
    <!-- Outer Button Shadow -->
    <ellipse cx="80" cy="85" rx="66" ry="66" fill="#D3C8BA" opacity="0.6"/>

    <!-- Wooden Disk Body -->
    <circle cx="80" cy="80" r="65" fill="#D9A873" stroke="#B37C42" stroke-width="3"/>

    <!-- Inset Groove Ring -->
    <circle cx="80" cy="80" r="50" fill="#E8BD8A" stroke="#C48E54" stroke-width="2"/>

    <!-- Subtle Wood Grain Rings -->
    <ellipse cx="80" cy="80" rx="38" ry="36" fill="none" stroke="#D19C62" stroke-width="1.5" stroke-dasharray="14 8" opacity="0.6"/>
    <ellipse cx="82" cy="78" rx="25" ry="24" fill="none" stroke="#D19C62" stroke-width="1.2" stroke-dasharray="10 6" opacity="0.5"/>

    <!-- 4 Button Holes -->
    <circle cx="68" cy="68" r="6.5" fill="#422915"/>
    <circle cx="92" cy="68" r="6.5" fill="#422915"/>
    <circle cx="68" cy="92" r="6.5" fill="#422915"/>
    <circle cx="92" cy="92" r="6.5" fill="#422915"/>

    <!-- Criss-Cross Cotton Thread Stitch (Plum #8E5B74) -->
    <!-- Diagonal 1 -->
    <line x1="68" y1="68" x2="92" y2="92" stroke="#8E5B74" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="68" y1="68" x2="92" y2="92" stroke="#FAF4F7" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Diagonal 2 -->
    <line x1="92" y1="68" x2="68" y2="92" stroke="#8E5B74" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="92" y1="68" x2="68" y2="92" stroke="#FAF4F7" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
