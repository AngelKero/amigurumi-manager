<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Soft Base Shadow -->
  <ellipse cx="100" cy="170" rx="60" ry="12" fill="#E4D8DF" opacity="0.6"/>

  <!-- Wool Yarn Sphere -->
  <circle cx="100" cy="95" r="70" fill="#8E5B74"/>

  <!-- Interlocking Winding Threads -->
  <path d="M 45 80 C 70 40 130 40 155 80" stroke="#75475E" stroke-width="4.5" fill="none"/>
  <path d="M 40 100 C 65 60 135 60 160 100" stroke="#A66E8A" stroke-width="4" fill="none"/>
  <path d="M 45 115 C 75 160 125 160 155 115" stroke="#75475E" stroke-width="4.5" fill="none"/>
  <path d="M 60 135 C 85 165 115 165 140 135" stroke="#A66E8A" stroke-width="4" fill="none"/>
  
  <path d="M 80 35 C 50 75 50 125 80 155" stroke="#75475E" stroke-width="4.5" fill="none"/>
  <path d="M 100 28 C 70 70 70 130 100 162" stroke="#FAF4F7" stroke-width="2.5" stroke-dasharray="5 4" fill="none"/>
  <path d="M 120 35 C 150 75 150 125 120 155" stroke="#A66E8A" stroke-width="4" fill="none"/>

  <!-- Diagonal Bamboo / Wooden Crochet Hook Through the Ball -->
  <g transform="rotate(-35 100 95)">
    <!-- Hook Shaft -->
    <rect x="94" y="-30" width="12" height="250" rx="6" fill="#D99C52" stroke="#B87B32" stroke-width="1.2"/>
    <!-- Ergonomic Thumb Grip -->
    <rect x="91" y="70" width="18" height="45" rx="9" fill="#C48842"/>
    <text x="100" y="96" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="8" fill="#5E3A12">3.5</text>
    <!-- Hook Throat & Lip -->
    <path d="M 94 -30 C 94 -42 106 -45 106 -38 C 106 -34 100 -32 100 -30 Z" fill="#D99C52"/>
  </g>

  <!-- Loose Trailing Yarn Thread -->
  <path d="M 145 130 Q 170 160 140 180 Q 110 195 80 185" stroke="#8E5B74" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 145 130 Q 170 160 140 180 Q 110 195 80 185" stroke="#FAF4F7" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
</svg>
