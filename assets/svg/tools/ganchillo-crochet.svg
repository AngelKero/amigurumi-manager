<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <!-- Ganchillo de Crochet Ergonómico Artesanal -->
  <g transform="rotate(-8 120 30)">
    <!-- Mango de Madera / Silicona Ergonómica -->
    <path d="M 20 22 C 40 18 100 15 140 20 C 145 20 150 24 150 30 C 150 36 145 40 140 40 C 100 45 40 42 20 38 C 12 36 12 24 20 22 Z" fill="#8E5B74"/>
    <ellipse cx="70" cy="30" rx="20" ry="8" fill="#75475E" opacity="0.6"/>
    <!-- Relieve de agarre con pespunte -->
    <line x1="60" y1="26" x2="80" y2="26" stroke="#FAF4F7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="60" y1="34" x2="80" y2="34" stroke="#FAF4F7" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="110" y="33" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#FAF4F7">2.5 mm</text>

    <!-- Vástago Metálico Dorado / Latón -->
    <rect x="145" y="27" width="65" height="6" fill="#D99C52" stroke="#B87B32" stroke-width="0.8"/>
    <path d="M 145 26 L 155 26 L 155 34 L 145 34 Z" fill="#C48842"/>

    <!-- Cuello y Pico del Ganchillo -->
    <path d="M 205 27 C 215 27 222 25 225 22 C 227 20 228 23 226 26 C 224 29 218 31 216 33 C 214 34 205 33 205 33 Z" fill="#D99C52" stroke="#B87B32" stroke-width="0.8"/>
    <!-- Detalle de luz metálica -->
    <line x1="160" y1="28" x2="215" y2="28" stroke="#FFF7E6" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
