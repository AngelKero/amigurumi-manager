<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 250" width="100%" height="100%">
  <!-- Vintage Stork Embroidery Scissors (Tijeras Cigüeña de Bordado) -->
  <g fill="#D99C52" stroke="#B87B32" stroke-width="1.5" stroke-linejoin="round">
    <!-- Left Blade (Beak) -->
    <path d="M 75 110 L 71 20 C 71 16 75 14 75 14 C 75 14 75 110 75 110 Z" fill="#E8B87A"/>
    <!-- Right Blade (Beak) -->
    <path d="M 75 110 L 79 20 C 79 16 75 14 75 14 C 75 14 75 110 75 110 Z" fill="#C48842"/>

    <!-- Screw Pivot / Eye of the Stork -->
    <circle cx="75" cy="110" r="7" fill="#8C531B" stroke="#FAF4F7" stroke-width="1.5"/>
    <circle cx="75" cy="110" r="3" fill="#D99C52"/>

    <!-- Bird Neck & Body (Upper Handles) -->
    <path d="M 75 115 Q 60 135 60 160 Q 60 175 70 185 L 65 190" fill="none" stroke-width="5"/>
    <path d="M 75 115 Q 90 135 90 160 Q 90 175 80 185 L 85 190" fill="none" stroke-width="5"/>

    <!-- Engraved Feather Textures on Handle Shaft -->
    <path d="M 68 135 Q 62 145 68 155" stroke="#8C531B" stroke-width="1.2" fill="none"/>
    <path d="M 82 135 Q 88 145 82 155" stroke="#8C531B" stroke-width="1.2" fill="none"/>

    <!-- Finger Loops (Bottom Rings) -->
    <!-- Left Loop -->
    <ellipse cx="50" cy="205" rx="22" ry="28" fill="none" stroke-width="6"/>
    <ellipse cx="50" cy="205" rx="15" ry="21" fill="none" stroke="#8C531B" stroke-width="1.5"/>

    <!-- Right Loop -->
    <ellipse cx="100" cy="205" rx="22" ry="28" fill="none" stroke-width="6"/>
    <ellipse cx="100" cy="205" rx="15" ry="21" fill="none" stroke="#8C531B" stroke-width="1.5"/>
  </g>
</svg>
