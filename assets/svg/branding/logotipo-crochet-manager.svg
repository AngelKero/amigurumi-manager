<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 75" width="100%" height="100%" role="img" aria-label="Logotipo Crochet Manager">
  <title>Logotipo: Crochet Manager Wordmark</title>
  <defs>
    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E5B74"/>
      <stop offset="100%" stop-color="#75475E"/>
    </linearGradient>
  </defs>

  <!-- Pespunte Textil Superior Decorativo Sutil -->
  <path d="M12 12 L308 12" stroke="#E4E8ED" stroke-width="1.5" stroke-dasharray="4,4" stroke-linecap="round"/>

  <!-- Texto Principal de Marca: CROCHET -->
  <text x="14" y="44" 
        font-family="'Fraunces', 'Georgia', serif" 
        font-weight="800" 
        font-size="29" 
        letter-spacing="-0.02em" 
        fill="url(#logoTextGrad)">
    Crochet
  </text>

  <!-- Texto Secundario de Marca: MANAGER -->
  <text x="146" y="44" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-weight="700" 
        font-size="25" 
        letter-spacing="-0.01em" 
        fill="#1E252D">
    Manager
  </text>

  <!-- Remate de corazón artesanal sobre la hebra -->
  <circle cx="280" cy="38" r="2.8" fill="#D99C52"/>
  <circle cx="289" cy="38" r="2.8" fill="#8E5B74"/>
  <circle cx="298" cy="38" r="2.8" fill="#52857C"/>

  <!-- Línea de Hebra Textil Pespunteada Subyacente -->
  <path d="M14 56 L306 56" stroke="#8E5B74" stroke-width="2" stroke-dasharray="5,4" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Subtítulo Descriptor de Categoría -->
  <text x="15" y="68" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-weight="600" 
        font-size="8.5" 
        letter-spacing="0.16em" 
        text-transform="uppercase" 
        fill="#52857C">
    Micro-ERP &amp; Catálogo Artesanal
  </text>

  <!-- Remates circulares de hilo en los extremos -->
  <circle cx="14" cy="56" r="2.5" fill="#8E5B74"/>
  <circle cx="306" cy="56" r="2.5" fill="#D99C52"/>
</svg>
