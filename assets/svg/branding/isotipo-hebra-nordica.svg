<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Isotipo Hebra Nórdica">
  <title>Isotipo: Nube de Algodón y Hebra Botánica Nórdica</title>
  <defs>
    <linearGradient id="isoNubeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EBF4F2"/>
    </linearGradient>
    <linearGradient id="isoSpruceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6AA197"/>
      <stop offset="100%" stop-color="#52857C"/>
    </linearGradient>
    <filter id="isoNubeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#52857C" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Sombra inferior -->
  <ellipse cx="50" cy="85" rx="32" ry="5" fill="#1E252D" opacity="0.07"/>

  <!-- Nube Textil de Algodón Peinado -->
  <g filter="url(#isoNubeShadow)">
    <path d="M28 68 L72 68 C80 68 86 62 86 54 C86 47 81 41 74 40 C73 28 63 20 50 20 C38 20 29 27 27 38 C20 40 14 46 14 54 C14 62 20 68 28 68 Z" 
          fill="url(#isoNubeGrad)" stroke="#52857C" stroke-width="1.8"/>

    <!-- Pespunte Textil perimetral dentro de la nube -->
    <path d="M30 64 L70 64 C76 64 81 60 81 53 C81 47 77 42 71 42 C69 31 60 25 50 25 C40 25 32 30 30 40 C25 42 20 46 20 53 C20 59 24 64 30 64 Z" 
          fill="none" stroke="#8E5B74" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.55"/>
  </g>

  <!-- Aguja / Gancho en Diagonal de Abeto Nórdico -->
  <path d="M22 26 L78 74" stroke="url(#isoSpruceGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="23" cy="27" r="3" fill="#D99C52"/>

  <!-- Hebra de Miel Dorada entrelazada en forma de Infinito / Lazo -->
  <path d="M35 50 C35 42 45 42 50 50 C55 58 65 58 65 50 C65 42 55 42 50 50 C45 58 35 58 35 50 Z" 
        fill="none" stroke="#D99C52" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Tres puntos bordados artesanales (signature care tag dots) -->
  <circle cx="44" cy="74" r="1.8" fill="#8E5B74"/>
  <circle cx="50" cy="74" r="1.8" fill="#52857C"/>
  <circle cx="56" cy="74" r="1.8" fill="#D99C52"/>
</svg>
