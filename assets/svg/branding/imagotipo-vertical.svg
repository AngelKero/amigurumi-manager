<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="100%" height="100%" role="img" aria-label="Imagotipo Vertical Amigurumi Manager">
  <title>Imagotipo Vertical: Símbolo Central Superior y Wordmark Inferior</title>
  <defs>
    <linearGradient id="imagoVertOvillo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A56E8A"/>
      <stop offset="100%" stop-color="#75475E"/>
    </linearGradient>
    <linearGradient id="imagoVertHook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C17D"/>
      <stop offset="100%" stop-color="#D99C52"/>
    </linearGradient>
    <filter id="imagoVertShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8E5B74" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- ==================== 1. SÍMBOLO CENTRAL SUPERIOR ==================== -->
  <g id="imagoVertSimbolo" transform="translate(65, 12)">
    <!-- Contenedor Circular con Pespunte Textil -->
    <circle cx="45" cy="45" r="42" fill="#FDFBF9" stroke="#E4E8ED" stroke-width="1.5" filter="url(#imagoVertShadow)"/>
    <circle cx="45" cy="45" r="37" fill="none" stroke="#8E5B74" stroke-width="1.3" stroke-dasharray="3.5,3" opacity="0.4"/>

    <!-- Gancho de Crochet Cruzado -->
    <path d="M22 68 L68 22" stroke="url(#imagoVertHook)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M68 22 Q73 18 70 14 Q67 11 63 14 L61 17" fill="none" stroke="#D99C52" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="23" cy="67" r="2.8" fill="#52857C"/>

    <!-- Ovillo de Hilaza Central -->
    <circle cx="45" cy="46" r="24" fill="url(#imagoVertOvillo)"/>
    <path d="M26 38 C34 30 56 30 64 38" fill="none" stroke="#FAF3F6" stroke-width="2.2" opacity="0.6" stroke-linecap="round"/>
    <path d="M24 46 C33 39 57 39 66 46" fill="none" stroke="#FAF3F6" stroke-width="2.8" opacity="0.75" stroke-linecap="round"/>
    <path d="M26 54 C34 62 56 62 64 54" fill="none" stroke="#FAF3F6" stroke-width="2.2" opacity="0.6" stroke-linecap="round"/>
    <circle cx="45" cy="46" r="19" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Hebra en Forma de Corazón -->
    <path d="M59 32 C65 24 72 21 70 16 C67 10 59 11 54 18 C49 11 41 10 38 16 C36 21 43 24 49 32" 
          fill="none" stroke="#8E5B74" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- ==================== 2. TEXTO INFERIOR ==================== -->
  <g id="imagoVertTexto">
    <!-- Título Primario: AMIGURUMI -->
    <text x="110" y="132" 
          font-family="'Fraunces', 'Georgia', serif" 
          font-weight="800" 
          font-size="24" 
          letter-spacing="-0.01em" 
          text-anchor="middle" 
          fill="#8E5B74">
      Amigurumi
    </text>

    <!-- Título Secundario: MANAGER -->
    <text x="110" y="154" 
          font-family="'Outfit', sans-serif" 
          font-weight="700" 
          font-size="19" 
          letter-spacing="0.06em" 
          text-anchor="middle" 
          fill="#1E252D">
      MANAGER
    </text>

    <!-- Puntos decorativos en las 'i' -->
    <circle cx="70" cy="116" r="2.4" fill="#D99C52"/>
    <circle cx="123" cy="116" r="2.4" fill="#D99C52"/>
    <circle cx="152" cy="116" r="2.4" fill="#D99C52"/>

    <!-- Línea decorativa pespunteada -->
    <path d="M40 166 L180 166" stroke="#8E5B74" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.4"/>
    <circle cx="40" cy="166" r="2" fill="#52857C"/>
    <circle cx="180" cy="166" r="2" fill="#D99C52"/>

    <!-- Subtítulo Descriptor en Píldora Textil -->
    <rect x="36" y="174" width="148" height="18" rx="9" fill="#EBF4F2" stroke="#52857C" stroke-width="0.8"/>
    <text x="110" y="186.5" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="700" 
          font-size="8" 
          letter-spacing="0.12em" 
          text-anchor="middle" 
          fill="#235048">
      MICRO-ERP &amp; CATÁLOGO
    </text>
  </g>
</svg>
