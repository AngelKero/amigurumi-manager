<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%" role="img" aria-label="Imagotipo Horizontal Amigurumi Manager">
  <title>Imagotipo Horizontal: Símbolo y Wordmark Separables</title>
  <defs>
    <linearGradient id="imagoOvilloGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A56E8A"/>
      <stop offset="100%" stop-color="#75475E"/>
    </linearGradient>
    <linearGradient id="imagoHookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C17D"/>
      <stop offset="100%" stop-color="#D99C52"/>
    </linearGradient>
    <filter id="imagoPillShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8E5B74" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ==================== 1. SÍMBOLO (ISOTIPO IZQUIERDO) ==================== -->
  <g id="imagoSimbolo" transform="translate(10, 5)">
    <!-- Contenedor Píldora Textil con Pespunte -->
    <rect x="0" y="0" width="75" height="75" rx="20" fill="#FDFBF9" stroke="#E4E8ED" stroke-width="1.5" filter="url(#imagoPillShadow)"/>
    <rect x="5" y="5" width="65" height="65" rx="16" fill="none" stroke="#8E5B74" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.35"/>

    <!-- Gancho de Crochet Cruzado -->
    <path d="M16 58 L58 16" stroke="url(#imagoHookGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M58 16 Q62 12 60 9 Q58 6 54 9 L52 12" fill="none" stroke="#D99C52" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="17" cy="57" r="2.5" fill="#52857C"/>

    <!-- Ovillo de Hilaza Central -->
    <circle cx="37.5" cy="40" r="21" fill="url(#imagoOvilloGrad)"/>
    <path d="M20 33 C27 26 48 26 55 33" fill="none" stroke="#FAF3F6" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <path d="M18 40 C26 34 49 34 57 40" fill="none" stroke="#FAF3F6" stroke-width="2.5" opacity="0.7" stroke-linecap="round"/>
    <path d="M20 47 C27 54 48 54 55 47" fill="none" stroke="#FAF3F6" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
    <circle cx="37.5" cy="40" r="17" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2.5,2.5" opacity="0.5"/>

    <!-- Hebra en forma de corazón saliente -->
    <path d="M50 28 C55 20 62 17 60 12 C57 6 50 7 45 13 C40 7 33 6 30 12 C28 17 35 20 40 28" 
          fill="none" stroke="#8E5B74" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Divisor Vertical en Pespunte Textil -->
  <path d="M102 14 L102 74" stroke="#E4E8ED" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- ==================== 2. TEXTO (LOGOTIPO DERECHO) ==================== -->
  <g id="imagoTexto" transform="translate(118, 0)">
    <!-- Etiqueta de Marca -->
    <text x="0" y="24" 
          font-family="'Outfit', sans-serif" 
          font-weight="700" 
          font-size="9" 
          letter-spacing="0.18em" 
          text-transform="uppercase" 
          fill="#D99C52">
      TALLER TEXTIL &amp; CONFECCIÓN
    </text>

    <!-- Título Principal -->
    <text x="0" y="52" 
          font-family="'Fraunces', 'Georgia', serif" 
          font-weight="800" 
          font-size="28" 
          letter-spacing="-0.02em" 
          fill="#8E5B74">
      Amigurumi <tspan fill="#1E252D" font-family="'Outfit', sans-serif" font-weight="700">Manager</tspan>
    </text>

    <!-- Puntos de costura decorativos en la 'i' -->
    <circle cx="37.5" cy="35" r="2.8" fill="#D99C52"/>
    <circle cx="99.5" cy="35" r="2.8" fill="#D99C52"/>
    <circle cx="134" cy="35" r="2.8" fill="#D99C52"/>

    <!-- Descriptor y Submarca -->
    <text x="0" y="72" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-weight="600" 
          font-size="10" 
          letter-spacing="0.06em" 
          fill="#52857C">
      Micro-ERP • Control de Costos, Stock &amp; Pedidos
    </text>

    <!-- Línea de costura final suave -->
    <path d="M0 80 L250 80" stroke="#8E5B74" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.25"/>
  </g>
</svg>
