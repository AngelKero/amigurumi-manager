<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="500" height="500" rx="28" fill="#FAF4F7"/>
  <rect x="12" y="12" width="476" height="476" rx="20" fill="none" stroke="#8E5B74" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>

  <!-- Base Shadow -->
  <ellipse cx="250" cy="425" rx="130" ry="20" fill="#E4D8DF" opacity="0.6"/>

  <!-- Big Plum Yarn Ball next to Kitten -->
  <g>
    <!-- Shadow for Yarn Ball -->
    <ellipse cx="325" cy="385" rx="65" ry="18" fill="#D3C3CE" opacity="0.6"/>
    <!-- Yarn Sphere -->
    <circle cx="325" cy="330" r="65" fill="#8E5B74"/>
    <!-- Textured Windings -->
    <path d="M 275 320 Q 325 280 375 330" stroke="#75475E" stroke-width="3.5" fill="none"/>
    <path d="M 285 350 Q 325 380 380 340" stroke="#75475E" stroke-width="3.5" fill="none"/>
    <path d="M 310 270 Q 360 330 320 390" stroke="#A66E8A" stroke-width="3" fill="none"/>
    <path d="M 290 290 Q 340 330 350 370" stroke="#FAF4F7" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <!-- Yarn Thread Trailing to Cat Paw -->
    <path d="M 270 360 Q 230 400 205 355 Q 190 320 180 340" stroke="#8E5B74" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Kitten Body (Cream Velvet) -->
  <ellipse cx="190" cy="310" rx="80" ry="70" fill="#FFFDF8" stroke="#E8E2D5" stroke-width="2"/>

  <!-- Kitten Head -->
  <circle cx="180" cy="205" r="75" fill="#FFFDF8" stroke="#E8E2D5" stroke-width="2"/>

  <!-- Calico Ear Patches & Ears -->
  <!-- Left Ear -->
  <path d="M 120 160 L 110 95 L 165 140 Z" fill="#D99C52"/>
  <path d="M 125 150 L 118 108 L 155 138 Z" fill="#F4B8C7"/>
  <!-- Right Ear -->
  <path d="M 205 140 L 250 95 L 240 160 Z" fill="#8E5B74"/>
  <path d="M 212 142 L 242 108 L 235 152 Z" fill="#F4B8C7"/>

  <!-- Calico Eye Patch on Left Side -->
  <path d="M 125 185 Q 165 170 165 220 Q 130 240 120 205 Z" fill="#D99C52" opacity="0.85"/>

  <!-- Safety Eyes -->
  <circle cx="150" cy="205" r="10" fill="#1E252D"/>
  <circle cx="153" cy="202" r="3.5" fill="#FFFFFF"/>
  <circle cx="210" cy="205" r="10" fill="#1E252D"/>
  <circle cx="213" cy="202" r="3.5" fill="#FFFFFF"/>

  <!-- Nose & Kawaii Mouth -->
  <polygon points="180,218 174,225 186,225" fill="#E8849E"/>
  <path d="M 174 227 Q 180 234 186 227" stroke="#1E252D" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 180 225 L 180 229" stroke="#1E252D" stroke-width="2"/>

  <!-- Whiskers -->
  <line x1="110" y1="215" x2="135" y2="218" stroke="#87929E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="110" y1="228" x2="135" y2="225" stroke="#87929E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="225" y1="218" x2="250" y2="215" stroke="#87929E" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="225" y1="225" x2="250" y2="228" stroke="#87929E" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Kitten Paws playing with yarn -->
  <circle cx="205" cy="340" r="16" fill="#FFFDF8" stroke="#E8E2D5" stroke-width="1.5"/>
  <circle cx="205" cy="340" r="6" fill="#F4B8C7"/>

  <!-- Curved Tail -->
  <path d="M 115 320 C 70 330 65 260 90 240" stroke="#D99C52" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Bottom Crafted Ribbon Tag -->
  <g transform="translate(130, 440)">
    <rect width="240" height="34" rx="17" fill="#FFFFFF" stroke="#8E5B74" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="120" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#75475E">
      🐱 Gatito Calicó &bull; Con Ovillo
    </text>
  </g>
</svg>
